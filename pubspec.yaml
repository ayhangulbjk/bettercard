name: batak_king
description: "Batak & King - tamamen cevrimdisi Turk kagit oyunlari."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart state management. The dependency list is deliberately tiny:
  # milestone 1 must resolve and build with no platform plugin registration,
  # because the native host folders are generated by `flutter create .`.
  flutter_riverpod: ^2.5.1
  # Pure-Dart annotations (@immutable) for the Flutter-free domain layer.
  # Declared explicitly so the domain never reaches into package:flutter.
  meta: ^1.15.0
  # The one platform plugin: it answers "where may this app write files?".
  # Everything stored is a JSON file this app writes and reads itself, so a
  # key-value plugin would add a second storage mechanism without removing
  # this one. It opens no socket and asks for no permission; the offline
  # requirement is untouched. See docs/DECISIONS.md D-18.
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Build-time only: rasterises assets/icon/app_icon.png into the launcher
  # icon sets under android/ and ios/. Those folders are generated by
  # `flutter create` and not committed, so the icon has to be reproducible
  # from the repository rather than pasted in by hand. Nothing here ships in
  # the app bundle, and it opens no socket at runtime.
  flutter_launcher_icons: ^0.14.4

# Launcher icon generation. Re-run after every `flutter create .`:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ masks the icon to the launcher's own shape. The source art is
  # a full-bleed rounded square, so it is inset into the adaptive icon's safe
  # zone over the black the artwork already sits on; without the inset the
  # circular mask would cut the gold frame off at the corners.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 18

flutter:
  uses-material-design: true

  # NOTE: asset directories exist but are intentionally NOT declared yet.
  # Flutter fails the build on a declared-but-empty asset directory, and
  # milestone 1 renders every card procedurally (no bitmap assets). The block
  # below is enabled in the milestone that introduces real art.
  #
  # assets:
  #   - assets/cards/
  #   - assets/tables/
  #   - assets/avatars/
  #   - assets/audio/
